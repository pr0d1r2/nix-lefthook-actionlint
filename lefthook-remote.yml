---
pre-commit:
  commands:
    actionlint:
      glob: [".github/workflows/*.{yml,yaml}"]
      run: timeout ${LEFTHOOK_ACTIONLINT_TIMEOUT:-30} "$(command -v lefthook-actionlint || echo actionlint)" {staged_files}

pre-push:
  commands:
    actionlint:
      glob: [".github/workflows/*.{yml,yaml}"]
      run: timeout ${LEFTHOOK_ACTIONLINT_TIMEOUT:-30} "$(command -v lefthook-actionlint || echo actionlint)" {push_files}
